<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>柜台陈列助手 · 可视化后台管理平台</title>
<style>
  :root{
    --green:#2D6A4F; --green-d:#1B4D3A; --green-l:#3E8E6B;
    --cream:#F5F0E8; --paper:#FBF9F5; --ink:#222; --grey:#6B6B6B; --line:#E6E0D4;
    --danger:#E63946; --ok:#2E9E5B; --warn:#C9742B;
    --c-customer:#2D6A4F; --c-goods:#1D6FB8; --c-rule:#7A3FB0; --c-market:#C9742B;
    --shadow:0 6rpx 22rpx rgba(27,77,58,.10); --r-card:14px; --r-btn:8px;
    --sp:32px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:"PingFang SC","Microsoft YaHei","微软雅黑",-apple-system,sans-serif;
    color:var(--ink); background:var(--cream); line-height:1.55; font-size:14px;
    background-image:radial-gradient(1200px 480px at 80% -120px, rgba(62,142,107,.12), transparent 60%);
  }
  a{color:inherit}

  /* ---------- topbar ---------- */
  .topbar{
    position:sticky; top:0; z-index:30; backdrop-filter:saturate(1.4) blur(8px);
    background:linear-gradient(100deg,var(--green-d),var(--green));
    color:#fff; box-shadow:0 4px 18px rgba(27,77,58,.28);
  }
  .topbar-in{max-width:1280px;margin:0 auto;padding:14px var(--sp);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .brand .logo{
    width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-size:22px;
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);
  }
  .brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.5px}
  .brand p{margin:1px 0 0;font-size:11.5px;opacity:.85}
  .spacer{flex:1 1 auto}
  .src-toggle{display:flex;align-items:center;gap:10px;font-size:12px}
  .src-toggle input[type=text]{
    width:160px;padding:6px 9px;border-radius:7px;border:1px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.12);color:#fff;font-size:12px;outline:none;
  }
  .src-toggle input::placeholder{color:rgba(255,255,255,.6)}
  .switch{position:relative;display:inline-block;width:42px;height:23px;cursor:pointer;flex:none}
  .switch input{display:none}
  .switch .track{position:absolute;inset:0;background:rgba(255,255,255,.3);border-radius:20px;transition:.25s}
  .switch .dot{position:absolute;top:2.5px;left:2.5px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.25s}
  .switch input:checked + .track{background:#7CDCAE}
  .switch input:checked + .track + .dot{transform:translateX(19px)}

  /* ---------- layout ---------- */
  .wrap{max-width:1280px;margin:0 auto;padding:26px var(--sp) 60px}
  .section-title{display:flex;align-items:baseline;gap:12px;margin:6px 0 14px}
  .section-title h2{font-size:16px;margin:0;color:var(--green-d);font-weight:700}
  .section-title .sub{font-size:12px;color:var(--grey)}

  /* ---------- KPI hero ---------- */
  .kpi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:26px}
  .kpi{
    background:#fff;border-radius:var(--r-card);padding:16px 16px 14px;box-shadow:var(--shadow);
    border:1px solid var(--line);cursor:pointer;position:relative;overflow:hidden;transition:transform .18s,box-shadow .18s;
  }
  .kpi:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(27,77,58,.16)}
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--green-l)}
  .kpi .ic{font-size:20px}
  .kpi .v{font-size:26px;font-weight:800;color:var(--green-d);line-height:1.1;margin:6px 0 2px;font-variant-numeric:tabular-nums}
  .kpi .v .u{font-size:12px;font-weight:600;color:var(--grey);margin-left:3px}
  .kpi .k{font-size:12px;color:var(--grey)}

  /* ---------- chips ---------- */
  .chips{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px}
  .chip{
    padding:7px 16px;border-radius:30px;background:#fff;border:1px solid var(--line);
    font-size:13px;color:var(--grey);cursor:pointer;transition:.18s;user-select:none;font-weight:600;
  }
  .chip:hover{border-color:var(--green-l);color:var(--green-d)}
  .chip.active{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 4px 12px rgba(45,106,79,.3)}

  /* ---------- category sections ---------- */
  .cat-block{margin-bottom:30px}
  .cat-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding-left:2px}
  .cat-head .badge-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:19px;color:#fff;flex:none}
  .cat-head h3{margin:0;font-size:15px;font-weight:700}
  .cat-head .desc{font-size:12px;color:var(--grey)}
  .cat-head .cnt{margin-left:auto;font-size:12px;color:var(--grey);background:#fff;border:1px solid var(--line);padding:3px 11px;border-radius:20px}

  .card-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .card{
    background:#fff;border-radius:var(--r-card);border:1px solid var(--line);box-shadow:var(--shadow);
    padding:16px;cursor:pointer;position:relative;overflow:hidden;transition:transform .16s,box-shadow .16s,border-color .16s;
    display:flex;flex-direction:column;gap:8px;min-height:140px;
  }
  .card::after{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent,var(--green))}
  .card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(27,77,58,.16);border-color:var(--accent,var(--green-l))}
  .card:active{transform:translateY(-1px) scale(.99)}
  .card .row1{display:flex;align-items:center;gap:10px}
  .card .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:20px;background:var(--accent-bg,#EAF1EC);flex:none}
  .card .ttl{font-size:14.5px;font-weight:700;color:var(--ink)}
  .card .desc{font-size:12px;color:var(--grey);flex:1}
  .card .foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
  .tag{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600}
  .tag.ro{background:#EEF1F4;color:#5B6B7A}
  .tag.rw{background:#E6F6EC;color:var(--ok)}
  .card .metric{font-size:11.5px;color:var(--accent,var(--green-d));font-weight:700}
  .ripple{position:absolute;border-radius:50%;background:rgba(45,106,79,.22);transform:scale(0);animation:rip .55s ease-out;pointer-events:none}
  @keyframes rip{to{transform:scale(2.4);opacity:0}}

  /* ---------- drawer ---------- */
  .scrim{position:fixed;inset:0;background:rgba(20,38,30,.42);opacity:0;pointer-events:none;transition:.25s;z-index:40}
  .scrim.show{opacity:1;pointer-events:auto}
  .drawer{
    position:fixed;top:0;right:0;height:100%;width:min(560px,94vw);background:var(--paper);z-index:50;
    transform:translateX(102%);transition:transform .3s cubic-bezier(.22,.61,.36,1);box-shadow:-12px 0 40px rgba(0,0,0,.22);
    display:flex;flex-direction:column;
  }
  .drawer.show{transform:translateX(0)}
  .dh{padding:20px 24px 16px;background:linear-gradient(120deg,var(--accent,var(--green)),color-mix(in srgb,var(--accent,var(--green)) 70%,#000));color:#fff;position:relative}
  .dh .ic{font-size:30px}
  .dh h2{margin:6px 0 2px;font-size:19px;font-weight:800}
  .dh .meta{font-size:12px;opacity:.9}
  .dh .close{position:absolute;top:16px;right:18px;width:32px;height:32px;border:0;border-radius:9px;background:rgba(255,255,255,.18);color:#fff;font-size:18px;cursor:pointer;transition:.15s}
  .dh .close:hover{background:rgba(255,255,255,.32)}
  .db{padding:20px 24px 40px;overflow:auto}
  .blk{margin-bottom:20px}
  .blk h4{font-size:12.5px;letter-spacing:1px;color:var(--accent,var(--green));margin:0 0 8px;font-weight:800;display:flex;align-items:center;gap:7px}
  .blk h4::before{content:"";width:14px;height:14px;border-radius:4px;background:var(--accent,var(--green));opacity:.85}
  .intent{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent,var(--green));border-radius:10px;padding:12px 14px;font-size:13px;color:#3a3a3a}
  ul.feat{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
  ul.feat li{font-size:13px;padding-left:22px;position:relative;color:#3a3a3a}
  ul.feat li::before{content:"✦";position:absolute;left:2px;top:0;color:var(--accent,var(--green));font-size:12px}
  .src-line{font-size:12.5px;color:var(--grey);background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 12px;display:flex;flex-direction:column;gap:5px}
  .src-line code{font-family:Consolas,Menlo,monospace;background:#EEF1EC;color:var(--green-d);padding:1px 7px;border-radius:5px;font-size:12px}
  .method{font-weight:800;font-size:11px;padding:1px 7px;border-radius:5px;color:#fff;margin-right:6px}
  .method.GET{background:#2E9E5B}.method.POST{background:#1D6FB8}.method.DELETE{background:#E63946}.method.CRUD{background:#7A3FB0}

  table.dt{width:100%;border-collapse:collapse;font-size:12px;background:#fff;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
  table.dt th{background:var(--green);color:#fff;font-weight:600;text-align:left;padding:7px 9px;font-size:11.5px;white-space:nowrap}
  table.dt td{padding:6px 9px;border-top:1px solid var(--line);vertical-align:top}
  table.dt tr:nth-child(even) td{background:#F6F4EE}
  table.dt td code{font-family:Consolas,monospace;font-size:11px;color:var(--green-d)}
  .pill{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:10px;font-weight:600}
  .pill.g{background:#E6F6EC;color:#1f8a4c}.pill.r{background:#FBE7E9;color:#c32a37}.pill.y{background:#FBEFDD;color:#a9651c}.pill.b{background:#E4EEF8;color:#1a5fa0}.pill.n{background:#EEF0F2;color:#667}

  /* viz: 图库 + 柱状图 */
  .viz-cap{font-size:11.5px;color:var(--grey);margin:2px 0 8px;font-weight:700}
  .viz-gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
  .viz-gallery figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden;box-shadow:0 2px 8px rgba(27,77,58,.06)}
  .viz-gallery img{display:block;width:100%;height:76px;object-fit:cover;background:#F0EDE6}
  .viz-gallery figcaption{font-size:10.5px;color:#444;padding:4px 5px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .viz-gallery figure.broken{display:none}
  .viz-bars{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .viz-row{display:flex;align-items:center;gap:8px;font-size:11.5px}
  .viz-lab{flex:0 0 120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#444;text-align:right}
  .viz-track{flex:1;height:15px;background:#EFEBE2;border-radius:8px;overflow:hidden}
  .viz-fill{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--accent,var(--green)),var(--green-l));animation:growbar .6s ease}
  .viz-fill.neg{background:linear-gradient(90deg,#E08A8F,var(--danger))}
  .viz-val{flex:0 0 60px;font-variant-numeric:tabular-nums;font-weight:700;color:var(--green-d)}
  @keyframes growbar{from{width:0}}

  .btn{border:0;border-radius:var(--r-btn);padding:8px 15px;font-size:12.5px;font-weight:700;cursor:pointer;transition:.15s;font-family:inherit}
  .btn.primary{background:var(--green);color:#fff}.btn.primary:hover{background:var(--green-d)}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--green-d)}.btn.ghost:hover{border-color:var(--green)}
  .btn.mini{padding:4px 10px;font-size:11px}
  .btn.del{background:#FBE7E9;color:var(--danger)}.btn.del:hover{background:#f7d3d7}
  .editbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .editbar input,.editbar select{padding:6px 9px;border:1px solid var(--line);border-radius:7px;font-size:12px;font-family:inherit;outline:none}
  .editbar input:focus{border-color:var(--green)}
  .hint{font-size:11px;color:var(--grey);margin-top:8px}

  /* skeleton */
  .sk{height:13px;border-radius:5px;background:linear-gradient(90deg,#eee,#f6f6f6,#eee);background-size:200% 100%;animation:sh 1.1s infinite}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

  /* toast */
  #toasts{position:fixed;top:74px;right:22px;z-index:80;display:flex;flex-direction:column;gap:10px}
  .toast{background:#fff;border-left:4px solid var(--green);box-shadow:0 8px 26px rgba(0,0,0,.16);border-radius:10px;padding:11px 16px;font-size:13px;min-width:210px;
    transform:translateX(120%);animation:tin .3s forwards;display:flex;gap:9px;align-items:center}
  .toast.ok{border-color:var(--ok)} .toast.err{border-color:var(--danger)} .toast.info{border-color:#1D6FB8}
  @keyframes tin{to{transform:translateX(0)}}
  .toast.out{animation:tout .3s forwards}@keyframes tout{to{transform:translateX(120%);opacity:0}}

  footer{max-width:1280px;margin:0 auto;padding:18px var(--sp) 40px;color:var(--grey);font-size:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

  @media(max-width:1080px){.kpi-grid{grid-template-columns:repeat(3,1fr)}.card-grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:640px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.card-grid{grid-template-columns:1fr};:root{--sp:16px}}
</style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <div class="brand">
        <div class="logo">🗄️</div>
        <div>
          <h1>柜台陈列助手 · 后台管理平台</h1>
          <p>零售终端智能陈列生成系统 — 数据与运营可视化控制台</p>
        </div>
      </div>
      <div class="spacer"></div>
      <div class="src-toggle">
        <span>数据源</span>
        <label class="switch" title="开启后从实时后端拉取数据（需同源部署或后端开启 CORS）">
          <input type="checkbox" id="liveToggle" />
          <span class="track"></span><span class="dot"></span>
        </label>
        <span id="srcLabel">演示数据</span>
        <input type="text" id="apiBase" placeholder="http://47.103.65.4" value="http://47.103.65.4" />
      </div>
    </div>
  </header>

  <div class="wrap">
    <div class="section-title"><h2>运营总览</h2><span class="sub">系统数据资产一览 · 点击卡片可跳转对应模块</span></div>
    <div class="kpi-grid" id="kpiGrid"></div>

    <div class="section-title"><h2>管理模块</h2><span class="sub">按业务域分类 · 点击任意卡片查看模块的设计初衷、功能介绍与数据预览</span></div>
    <div class="chips" id="chips"></div>
    <div id="cats"></div>
  </div>

  <footer>
    <span>柜台陈列助手 · 可视化后台管理平台　|　AI 赋能主题技能比武参评材料</span>
    <span id="footMeta"></span>
  </footer>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>
  <div id="toasts"></div>

<script>
/* =====================================================================
 *  数据模型：分区 / KPI / 模块（含设计初衷、功能介绍、字段说明、示例数据）
 *  —— 同一份元数据同时驱动界面渲染与《系统说明手册》对应章节
 * ===================================================================== */
const CATEGORIES = [
  { id:'customer', name:'客户数据中心', icon:'🏪', color:'var(--c-customer)', bg:'#EAF1EC',
    desc:'门店身份、柜台、库存与主营品规 —— 智能选品与分层的事实来源' },
  { id:'goods', name:'商品与陈列资源', icon:'📦', color:'var(--c-goods)', bg:'#E4EEF8',
    desc:'品类目录与陈列位图片素材 —— 定义“可以陈列什么”' },
  { id:'rule', name:'智能规则中心', icon:'🧠', color:'var(--c-rule)', bg:'#F0E9F8',
    desc:'话术、节日、关联规则与陈列算法参数 —— 定义“如何陈列、如何推介”' },
  { id:'market', name:'市场参考数据', icon:'📊', color:'var(--c-market)', bg:'#FBEFDD',
    desc:'区域均价、脱销、铺市、批发等行业洞察 —— 辅助选品与排序决策' },
];

const KPIS = [
  { ic:'🏪', v:128, u:'家', k:'接入门店', jump:'customer' },
  { ic:'🚬', v:386, u:'种', k:'品类规格', jump:'goods' },
  { ic:'🧩', v:7,   u:'类', k:'功能专区', jump:'goods' },
  { ic:'💬', v:86,  u:'条', k:'经营话术', jump:'rule' },
  { ic:'🗃️', v:14,  u:'张', k:'业务数据表', jump:'market' },
  { ic:'🕒', v:'2026-05', u:'', k:'最近数据快照', jump:'market' },
];

const MODULES = [
  /* ---------------- 客户数据中心 ---------------- */
  {
    id:'cust_info', cat:'customer', icon:'🪪', title:'客户档案', access:'只读', metric:'128 家门店',
    desc:'门店入网时间与 POS 标记，分层判定的依据',
    intent:'客户分层（新客户 / 常规客户）是整个系统流程分叉的起点：它决定了选品数据来源、功能专区与价签是否可用。后台集中呈现每家门店的分层判定依据，便于核对“某门店为何看不到专区/价签”。',
    features:[
      '按客户编号检索门店基础档案；',
      '展示入网时间，并按“距今 3 个月”实时换算为新客户 / 常规客户；',
      'POS 标记（has_pos）决定价签白名单走 POS 版还是非 POS 版；',
      '分层结果直接驱动小程序登录后的流程分叉。',
    ],
    source:'表 cust_info', method:'GET', api:'/api/customer-info/:id', needId:true,
    fields:[
      ['customer_id','VARCHAR','客户编号（主键）'],
      ['joined_at','DATE','入网日期 → 据此判定分层'],
      ['has_pos','TINYINT','是否安装 POS 收银终端（0/1）→ 价签白名单'],
    ],
    columns:['客户编号','入网日期','距今','分层','POS'],
    rows:[
      ['116314785','2025-11-02','约 7 个月',['常规','pill g'],['是','pill b']],
      ['208857013','2026-04-18','约 2 个月',['新客户','pill y'],['否','pill n']],
      ['319920446','2023-06-30','近 3 年',['常规','pill g'],['是','pill b']],
      ['457782100','2026-03-20','约 3 个月',['新客户','pill y'],['否','pill n']],
    ],
  },
  {
    id:'cust_counters', cat:'customer', icon:'📐', title:'柜台台账', access:'只读', metric:'按门店',
    desc:'门店前柜/吊柜/背柜的尺寸与层数台账',
    intent:'门店真实的柜台长度与层数是容量自适应算法的输入。沉淀台账后，店主登录即可自动回填柜台，免去每次重复录入，也保证历次出图口径一致。',
    features:[
      '按门店列出前柜 / 吊柜 / 背柜及各自长度、层数；',
      'sort_order 控制柜台展示顺序（前柜 → 吊柜 → 背柜）；',
      '供小程序 counter-config 页登录后自动回填；',
      '为容量公式“⌊长度÷6⌋×层数”提供原始尺寸。',
    ],
    source:'表 cust_counters', method:'GET', api:'/api/customer-counters/:id', needId:true,
    fields:[
      ['customer_id','VARCHAR','客户编号'],
      ['counter_id','VARCHAR','柜台编号'],
      ['type','ENUM','front 前柜 / hanging 吊柜 / back 背柜'],
      ['length','INT','柜台长度（cm）'],
      ['levels','INT','层数'],
      ['sort_order','INT','展示顺序'],
    ],
    columns:['客户编号','柜台编号','类型','长度cm','层数','排序'],
    rows:[
      ['116314785','f1',['前柜','pill g'],120,3,1],
      ['116314785','h1',['吊柜','pill b'],80,4,2],
      ['116314785','b1',['背柜','pill y'],200,5,3],
    ],

const KV_LABEL={customer_id:'客户编号',customer_class:'客户分层',joined_at:'入网日期',has_pos:'POS 终端',spec_count:'规格数',spec_detail:'品规明细',updated_at:'更新时间'};
function esc(s){ return String(s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }
function fmtCell(v){ if(v==null)return''; if(typeof v==='object')return Array.isArray(v)?v.length+' 项':'…'; return String(v); }
function fmtVal(num,unit){ if(unit==='元')return '¥'+num; if(unit==='%')return num+'%'; if(unit)return num+' '+unit; return ''+num; }
function imgUrl(u){ if(!u)return''; if(/^https?:/i.test(u))return u; const b=$('#apiBase').value.trim().replace(/\/$/,'')||location.origin; return b+u; }
function pickImg(o,v){ return o[v.liveImgKey]||o.thumbnailImageUrl||(o.images&&o.images[0])||o.imageUrl||o.thumbUrl; }
function kvVal(k,v){ if(k==='customer_class')return v==='regular'?'常规客户':'新客户'; if(typeof v==='boolean')return v?'是':'否'; return v==null?'—':String(v); }
function kvTable(o){ return tableHtml(['字段','值'],Object.keys(o).map(k=>[KV_LABEL[k]||k,kvVal(k,o[k])])); }
function renderViz(m,records,isLive){
  const vz=$('#vizZone'); if(!vz)return; const v=m.viz; if(!v){vz.innerHTML='';return;}
  if(v.kind==='gallery'){
    const list=(isLive&&records?records.slice(0,12).map(o=>({name:o[v.liveNameKey]||o.name||o.label||o.id||'',url:imgUrl(pickImg(o,v))}))
               :v.demo.map(d=>({name:d.name,url:imgUrl(d.url)}))).filter(x=>x.url);
    vz.innerHTML='<div class="viz-cap">🖼 图片资产预览（'+(isLive?'实时':'样例')+' · '+list.length+' 项）</div>'+
      '<div class="viz-gallery">'+list.map(x=>'<figure><img loading="lazy" src="'+x.url+'" onerror="this.closest(\'figure\').classList.add(\'broken\')"/><figcaption>'+esc(x.name)+'</figcaption></figure>').join('')+'</div>';
  } else {
    const pairs=(isLive&&records?records.map(o=>[String(o[v.liveLabelKey]??''),Number(o[v.liveValueKey])]).filter(p=>Number.isFinite(p[1]))
                :v.demo.map(d=>[d[0],Number(d[1])])).slice(0,12);
    if(!pairs.length){vz.innerHTML='';return;}
    const maxAbs=Math.max.apply(null,pairs.map(p=>Math.abs(p[1])).concat([1]));
    vz.innerHTML='<div class="viz-cap">📊 数据可视化（'+(isLive?'实时':'样例')+(v.unit?' · 单位 '+v.unit:'')+'）</div>'+
      '<div class="viz-bars">'+pairs.map(p=>{
        const neg=p[1]<0, w=Math.max(2,Math.abs(p[1])/maxAbs*100), num=Math.round(p[1]*10)/10;
        return '<div class="viz-row"><span class="viz-lab" title="'+esc(p[0])+'">'+esc(p[0])+'</span>'+
          '<span class="viz-track"><span class="viz-fill'+(neg?' neg':'')+'" style="width:'+w+'%"></span></span>'+
          '<span class="viz-val">'+fmtVal(num,v.unit)+'</span></div>';
      }).join('')+'</div>';
  }
}

const $ = (s,el=document)=>el.querySelector(s);

function ripple(e, el){
  const r = document.createElement('span'); r.className='ripple';
  const d = Math.max(el.clientWidth, el.clientHeight);
  const rect = el.getBoundingClientRect();
  r.style.width = r.style.height = d+'px';
  r.style.left = (e.clientX-rect.left-d/2)+'px';
  r.style.top  = (e.clientY-rect.top-d/2)+'px';
  el.appendChild(r); setTimeout(()=>r.remove(),560);
}

function toast(msg,type='info'){
  const t=document.createElement('div'); t.className='toast '+type;
  const ic={ok:'✅',err:'⛔',info:'ℹ️'}[type]||'ℹ️';
  t.innerHTML='<span>'+ic+'</span><span>'+msg+'</span>';
  $('#toasts').appendChild(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),300);},2600);
}

function renderKpis(){
  const g=$('#kpiGrid'); g.innerHTML='';
  KPIS.forEach(kpi=>{
    const el=document.createElement('div'); el.className='kpi';
    const numeric = typeof kpi.v==='number';
    el.innerHTML='<div class="ic">'+kpi.ic+'</div>'+
      '<div class="v"><span class="num">'+(numeric?'0':kpi.v)+'</span>'+(kpi.u?'<span class="u">'+kpi.u+'</span>':'')+'</div>'+
      '<div class="k">'+kpi.k+'</div>';
    el.onclick=()=>{ const c=catById(kpi.jump); if(c){ document.getElementById('catblk-'+c.id).scrollIntoView({behavior:'smooth',block:'start'}); flashCat(c.id);} };
    g.appendChild(el);
    if(numeric) countUp(el.querySelector('.num'), kpi.v);
  });
}
function countUp(node,target){
  const dur=900, t0=performance.now();
  function step(t){ const p=Math.min(1,(t-t0)/dur); node.textContent=Math.round(target*(0.2+0.8*p*p*(3-2*p))); if(p<1)requestAnimationFrame(step); else node.textContent=target; }
  requestAnimationFrame(step);
}

function tableHtml(columns,rows){
  let h='<table class="dt"><thead><tr>'+columns.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>';

/* ---------------- 实时后端拉取（演示降级） ---------------- */
async function fetchLive(m){
  const base=$('#apiBase').value.trim().replace(/\/$/,'');
  let url=base+(m.needId?m.api.replace(':id','116314785'):m.api);  // 演示客户编号
  if(m.liveQuery) url+=m.liveQuery;
  const zone=$('#dataZone'); const vz=$('#vizZone'); if(!zone)return;
  zone.innerHTML='<div class="sk" style="width:100%;margin:6px 0"></div>'.repeat(4);
  try{
    const ctrl=new AbortController(); const tm=setTimeout(()=>ctrl.abort(),6000);
    const res=await fetch(url,{signal:ctrl.signal}); clearTimeout(tm);
    const json=await res.json();
    // 单对象响应（如客户档案）→ 键值预览
    if(json.data && !Array.isArray(json.data) && typeof json.data==='object'){
      zone.innerHTML=kvTable(json.data); if(vz) vz.innerHTML='';
      toast(m.title+'：已加载实时数据','ok'); return;
    }
    const arr = json.categories||json.counters||json.inventory||json.prices||json.stockouts||
                json.coverage||json.fill_rates||json.ranks||json.growth||json.seasons||
                json.scripts||json.recommendations||json.specs||json.themes||json.data||[];
    if(Array.isArray(arr)&&arr.length){
      if(typeof arr[0]!=='object'){
        zone.innerHTML=tableHtml(['值'],arr.slice(0,40).map(v=>[String(v)]));
      } else {
        const cols=Object.keys(arr[0]).filter(k=>!['images','specIds','matched_specs'].includes(k)).slice(0,6);
        zone.innerHTML=tableHtml(cols,arr.slice(0,15).map(o=>cols.map(k=>fmtCell(o[k]))));
      }
      if(vz) renderViz(m,arr,true);
      toast(m.title+'：已加载实时数据 '+arr.length+' 行','ok');
    } else { zone.innerHTML=tableHtml(m.columns,m.rows); if(vz) renderViz(m,null,false); toast(m.title+'：实时无数据，显示样例','info'); }
  }catch(err){
    zone.innerHTML=tableHtml(m.columns,m.rows); if(vz) renderViz(m,null,false);
    toast(m.title+'：实时拉取失败（'+(location.protocol==='file:'?'file:// 跨域':'网络')+'），已回退演示数据','err');
  }
}

/* ---------------- 可维护模块的编辑器（内存演示） ---------------- */
function editorHtml(m){
  const fs=m.editable.addFields.map(f=>{
    if(f.type==='select') return '<select data-k="'+f.key+'">'+f.options.map(o=>'<option>'+o+'</option>').join('')+'</select>';
    return '<input type="text" data-k="'+f.key+'" placeholder="'+f.label+'" />';
  }).join('');
  return '<div style="margin-top:12px">'+
    '<div class="editbar" id="editbar-'+m.id+'">'+fs+
      '<button class="btn primary mini" onclick="addRow(\''+m.id+'\')">+ 新增</button></div>'+
    '<div class="hint">演示模式下，新增 / 删除即时反映在上表（不写入真实数据库）。实时模式将调用 '+m.api+' 完成持久化。</div>'+
  '</div>';
}
function rebuildTable(m){
  const zone=$('#dataZone'); if(!zone)return;
  const rows=m.rows.map((r,i)=>{
    const copy=r.map(c=>Array.isArray(c)?'<span class="'+c[1]+'">'+c[0]+'</span>':c);
    copy.push('<button class="btn del mini" onclick="delRow(\''+m.id+'\','+i+')">删除</button>');
    return copy;
  });
  zone.innerHTML=tableHtml(m.columns.concat(['操作']),rows.map(r=>r));
}
function addRow(id){
  const m=MODULES.find(x=>x.id===id);
  const bar=document.getElementById('editbar-'+id);
  const vals={}; bar.querySelectorAll('[data-k]').forEach(inp=>vals[inp.dataset.k]=inp.value.trim());
  if(id==='customer_specs'){
    if(!vals.customer_id){ toast('请填写客户编号','err'); return; }
    const cnt=(vals.spec_detail?vals.spec_detail.split(',').filter(Boolean).length:0);
    m.rows.unshift([vals.customer_id,cnt,vals.spec_detail||'—',today()]);
  } else if(id==='praise'){
    if(!vals.target_value||!vals.script_text){ toast('请填写目标值与话术','err'); return; }
    m.rows.unshift([vals.scene||'通用',[vals.target_type,'pill b'],vals.target_value,vals.script_text]);
  }
  bar.querySelectorAll('[data-k]').forEach(inp=>{ if(inp.tagName==='INPUT')inp.value=''; });
  rebuildTable(m); toast('已保存（演示模式）','ok');
}
function delRow(id,i){ const m=MODULES.find(x=>x.id===id); m.rows.splice(i,1); rebuildTable(m); toast('已删除（演示模式）','ok'); }
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

/* 编辑模块打开时把表格替换成带“操作列”的版本 */
const _openDrawer=openDrawer;
openDrawer=function(id){ _openDrawer(id); const m=MODULES.find(x=>x.id===id); if(m&&m.editable&&!liveMode) rebuildTable(m); };

/* ---------------- 数据源切换 ---------------- */
$('#liveToggle').onchange=function(){
  liveMode=this.checked;
  $('#srcLabel').textContent=liveMode?'实时后端':'演示数据';
  toast(liveMode?'已切换到实时后端模式（需同源或开启 CORS）':'已切回演示数据模式', liveMode?'info':'ok');
};
$('#scrim').onclick=closeDrawer;
document.addEventListener('keydown',e=>{ if(e.key==='Escape')closeDrawer(); });

/* ---------------- 同源托管自动联通：经 http(s) 访问（如 /admin/）时默认实时后端 ---------------- */
(function(){
  const isFile = location.protocol === 'file:';
  $('#apiBase').value = isFile ? 'http://47.103.65.4' : location.origin;
  if(!isFile){ liveMode = true; $('#liveToggle').checked = true; $('#srcLabel').textContent = '实时后端'; }
})();
